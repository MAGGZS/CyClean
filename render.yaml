services:
  - type: web
    name: descarta-api
    runtime: node
    region: ohio
    plan: free
    branch: main
    rootDir: .
    buildCommand: npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile --prod=false && pnpm build:api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        value: TekiFUEvwA9wlT7Kq0idCju3St0l42koHjnM1J/uVUI=
      - key: SESSION_SECRET
        value: ZgBWcM91OkgUcfFcoRcXfGHV3dMPwGy46COxpWo7vA8=
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD_HASH
        value: "$argon2id$v=19$m=65536,t=3,p=4$4VrFLlvaL5Ut0y17yUV0Mg$PXmLjJG+w/SYKXf6qJPisNWHsnHayT9jCSnB/6FRlqg"
      - key: ADMIN_ROUTE
        value: painel-x7
      - key: ALLOWED_ORIGIN
        value: https://cyclean-rho.vercel.app
